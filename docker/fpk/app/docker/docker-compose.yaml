services:
  tgd:
    image: tgd:0.1.17"
    pull_policy: never
    container_name: tgd
    restart: unless-stopped
    # tgd-user-start
    # tgd-user-end
    ports:
      - "8787:8787"
    # telegram.env：API 凭据。runtime.env：TGD_DOWNLOAD_DIR（不要写在 environment 里，否则会盖掉）。
    env_file:
      - ${TRIM_PKGETC}/telegram.env
      - ${TRIM_PKGETC}/runtime.env
    environment:
      TGD_DATA_DIR: /data
      TGD_LISTEN: 0.0.0.0:8787
      TGD_LISTEN_SOCKET: /fnos/app.sock
      TGD_WEB_BASE: /app/tgd
      TZ: Asia/Shanghai
    volumes:
      - "/var/apps/tgd/shares/tgd/data:/data"
      - "/var/apps/tgd/shares/tgd/downloads:/downloads"
      - "${TRIM_APPDEST:-/var/apps/tgd/target}:/fnos"
      # tgd-extra-volumes-start
      # tgd-extra-volumes-end
