[package]
name = "tgd"
version = "0.1.0"
description = "Telegram 桌面端：托盘常驻 + 静默抓取/监控"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tgd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
dotenvy = "0.15"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
open = "5"
